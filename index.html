<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>CRA Virtual Gallery</title>

<script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    header {
        background: #222;
        color: white;
        padding: 25px 30px;
    }

    header h1 {
        margin: 0;
        font-size: 28px;
    }

    header p {
        margin: 8px 0 0;
        color: #ccc;
    }

    .gallery {
        max-width: 1400px;
        margin: 30px auto;
        padding: 0 20px;
    }

    /* Main viewer */

    .viewer {
        position: relative;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, .15);
    }

    model-viewer {
        display: block;
        width: 100%;
        height: 600px;
        background: #e9e9e9;
    }

    /* Fullscreen */

    .fullscreen {
        position: absolute;
        top: 15px;
        right: 15px;

        z-index: 10;

        border: 0;
        border-radius: 6px;

        padding: 10px 15px;

        background: rgba(0, 0, 0, .7);
        color: white;

        cursor: pointer;
        font-size: 14px;
    }

    .fullscreen:hover {
        background: rgba(0, 0, 0, .9);
    }

    /* Information */

    .info {
        padding: 20px 25px;
    }

    .info h2 {
        margin: 0 0 8px;
    }

    .info p {
        margin: 0;
        color: #666;
        line-height: 1.5;
    }

    /* Gallery */

    .gallery-grid {
        display: grid;
        grid-template-columns:
            repeat(auto-fill, minmax(180px, 1fr));

        gap: 15px;

        margin-top: 25px;
    }

    .card {
        background: white;

        border: 3px solid transparent;

        border-radius: 10px;

        overflow: hidden;

        cursor: pointer;

        transition: .2s;

        box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
    }

    .card:hover {
        transform: translateY(-3px);
    }

    .card.selected {
        border-color: #0078d4;
    }

    .card img {
        width: 100%;
        height: 130px;

        object-fit: cover;

        display: block;
    }

    .card-title {
        padding: 12px;

        font-weight: bold;

        font-size: 14px;
    }

    /* Mobile */

    @media (max-width: 700px) {

        model-viewer {
            height: 450px;
        }

        .gallery-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 450px) {

        model-viewer {
            height: 350px;
        }

        .gallery-grid {
            grid-template-columns: 1fr 1fr;
        }
    }
</style>
```

</head>

<body>

<header>

```
<h1>CRA Virtual Gallery</h1>

<p>
    Explore our collection of interactive 3D models
</p>
```

</header>

<main class="gallery">

```
<!-- ================================================= -->
<!-- ONE MODEL VIEWER -->
<!-- ================================================= -->

<div class="viewer" id="viewerContainer">

    <model-viewer
        id="modelViewer"

        camera-controls
        auto-rotate

        shadow-intensity="1"

        exposure="1"

        alt="3D model">

    </model-viewer>


    <button
        class="fullscreen"
        id="fullscreenButton">

        ⛶ Fullscreen

    </button>


    <div class="info">

        <h2 id="modelTitle">
            Personalized Crotalus
        </h2>

        <p id="modelDescription">
            A crotalus clapper used when bells are not allowed
            for Good Friday service, personalized by its owner.
        </p>

    </div>

</div>


<!-- ================================================= -->
<!-- MODEL THUMBNAILS -->
<!-- ================================================= -->

<div
    class="gallery-grid"
    id="galleryGrid">

</div>
```

</main>

<script>


/* =====================================================
   MODEL DATA
   ===================================================== */

const models = [

    {
        title: "Personalized Crotalus",

        description:
            "A crotalus clapper used when bells are not allowed for Good Friday service, personalized by its owner.",

        model:
            "models/Personalized%20crotalus.glb",

        thumbnail:
            "Personalized%20crotalus.jpg"
    },


    {
        title: "Apple Corer",

        description:
            "Apple corer used by the sisters to make apple sauce.",

        model:
            "models/Apple%20corer.glb",

        thumbnail:
            "Apple%20corer.png"
    }

];


/* =====================================================
   ELEMENTS
   ===================================================== */

const viewer =
    document.getElementById("modelViewer");

const title =
    document.getElementById("modelTitle");

const description =
    document.getElementById("modelDescription");

const gallery =
    document.getElementById("galleryGrid");

const viewerContainer =
    document.getElementById("viewerContainer");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* =====================================================
   LOAD MODEL
   ===================================================== */

function selectModel(index) {

    const model = models[index];


    /*
     * Change the model
     */

    viewer.src = model.model;


    /*
     * Change information
     */

    title.textContent =
        model.title;

    description.textContent =
        model.description;


    /*
     * Update selected thumbnail
     */

    const cards =
        document.querySelectorAll(".card");

    cards.forEach((card, i) => {

        card.classList.toggle(
            "selected",
            i === index
        );

    });

}


/* =====================================================
   CREATE GALLERY
   ===================================================== */

models.forEach((model, index) => {

    const card =
        document.createElement("div");

    card.className = "card";


    card.innerHTML = `

        <img
            src="${model.thumbnail}"
            alt="${model.title}">

        <div class="card-title">
            ${model.title}
        </div>

    `;


    card.addEventListener(
        "click",
        () => selectModel(index)
    );


    gallery.appendChild(card);

});


/* =====================================================
   FULLSCREEN
   ===================================================== */

fullscreenButton.addEventListener(
    "click",
    () => {

        if (!document.fullscreenElement) {

            viewerContainer.requestFullscreen();

        } else {

            document.exitFullscreen();

        }

    }
);


/* =====================================================
   LOAD FIRST MODEL
   ===================================================== */

selectModel(0);


</script>

</body>

</html>
