<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRA Gallery Test</title>

<script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
    }

    h1 {
        background: #222;
        color: white;
        margin: 0;
        padding: 20px;
    }

    .viewer {
        max-width: 1200px;
        margin: 30px auto;
        padding: 20px;
    }

    model-viewer {
        width: 100%;
        height: 600px;
        background: #ddd;
    }

</style>
```

</head>

<body>

<h1>CRA Virtual Gallery</h1>

<div class="viewer">

```
<model-viewer

    id="viewer"

    src="models/Personalized crotalus.glb"

    alt="Personalized Crotalus"

    camera-controls

    auto-rotate

    shadow-intensity="1">

</model-viewer>
```

</div>

</body>

</html>
