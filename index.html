<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CRA Virtual Gallery</title>

<!-- Google Model Viewer -->
<script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    header {
        background: #222;
        color: white;
        padding: 20px 30px;
    }

    header h1 {
        margin: 0;
        font-size: 28px;
    }

    header p {
        margin: 6px 0 0;
        color: #ccc;
    }

    .gallery-container {
        max-width: 1400px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .viewer-container {
        position: relative;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    model-viewer {
        width: 100%;
        height: 600px;
        background: #eeeeee;
    }

    .model-info {
        padding: 20px 25px;
    }

    .model-info h2 {
        margin: 0 0 8px;
        font-size: 24px;
    }

    .model-info p {
        margin: 0;
        color: #666;
        line-height: 1.5;
    }

    .thumbnail-gallery {
        display: grid;
        grid-template-columns:
            repeat(auto-fill, minmax(180px, 1fr));

        gap: 15px;
        margin-top: 25px;
    }

    .thumbnail {
        border: 2px solid transparent;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .thumbnail:hover {
        transform: translateY(-3px);
    }

    .thumbnail.active {
        border-color: #0078d4;
    }

    .thumbnail img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        display: block;
    }

    .thumbnail-title {
        padding: 10px;
        font-weight: bold;
        font-size: 14px;
    }

    .fullscreen-button {
        position: absolute;
        top: 20px;
        right: 20px;

        background: rgba(0,0,0,0.65);
        color: white;

        border: none;
        border-radius: 6px;

        padding: 10px 14px;

        cursor: pointer;
        z-index: 10;
    }

    .fullscreen-button:hover {
        background: rgba(0,0,0,0.85);
    }

    .loading {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        background: white;

        padding: 15px 25px;

        border-radius: 8px;

        font-weight: bold;

        z-index: 5;
    }

    .error {
        display: none;

        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        background: #fff;

        padding: 20px;

        border-radius: 8px;

        max-width: 500px;

        text-align: center;

        box-shadow: 0 3px 15px rgba(0,0,0,.2);

        z-index: 6;
    }

    @media (max-width: 768px) {

        model-viewer {
            height: 450px;
        }

        .thumbnail-gallery {
            grid-template-columns: repeat(2, 1fr);
        }

    }

    @media (max-width: 480px) {

        model-viewer {
            height: 350px;
        }

    }

</style>

</head>

<body>

<header>

<h1>CRA Virtual Gallery</h1>

<p>
    Explore our collection of interactive 3D models
</p>

</header>

<main class="gallery-container">

<div class="viewer-container">

    <div id="loading"
         class="loading">

        Loading 3D model...

    </div>


    <div id="error"
         class="error">

        <strong>Unable to load the 3D model.</strong>

        <p id="errorMessage"></p>

    </div>


    <model-viewer
        id="modelViewer"

        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"

        alt="3D model">

    </model-viewer>


    <button
        class="fullscreen-button"
        onclick="toggleFullscreen()">

        ⛶ Fullscreen

    </button>


    <div class="model-info">

        <h2 id="modelTitle"></h2>

        <p id="modelDescription"></p>

    </div>

</div>


<div
    id="thumbnailGallery"
    class="thumbnail-gallery">

</div>

</main>

<script> /* * ====================================================== * YOUR MODELS * ====================================================== */ const models = [ { title: "Personalized Crotalus", description: "A crotalus clapper, used when bells are not allowed for Good Friday service, personalized by its owner.", model: "models/Personalized%20crotalus.glb", thumbnail: "Personalized%20crotalus.jpg" }, { title: "Apple Corer", description: "Apple corer used by the sisters to make apple sauce.", model: "models/Apple%20corer.glb", thumbnail: "Apple%20corer.png" } ]; /* * ====================================================== * ELEMENTS * ====================================================== */ const viewer = document.getElementById("modelViewer"); const title = document.getElementById("modelTitle"); const description = document.getElementById("modelDescription"); const thumbnailGallery = document.getElementById("thumbnailGallery"); const loading = document.getElementById("loading"); const error = document.getElementById("error"); const errorMessage = document.getElementById("errorMessage"); /* * ====================================================== * LOAD MODEL * ====================================================== */ function loadModel(index) { const model = models[index]; loading.style.display = "block"; error.style.display = "none"; title.textContent = model.title; description.textContent = model.description; viewer.src = model.model; document .querySelectorAll(".thumbnail") .forEach((thumbnail, i) => { thumbnail.classList.toggle( "active", i === index ); }); } /* * ====================================================== * MODEL LOADED * ====================================================== */ viewer.addEventListener("load", function () { loading.style.display = "none"; error.style.display = "none"; }); /* * ====================================================== * MODEL ERROR * ====================================================== */ viewer.addEventListener("error", function () { loading.style.display = "none"; error.style.display = "block"; errorMessage.textContent = "The model could not be loaded. Check that the GLB filename and path are correct."; }); /* * ====================================================== * CREATE THUMBNAILS * ====================================================== */ models.forEach((model, index) => { const thumbnail = document.createElement("div"); thumbnail.className = "thumbnail"; thumbnail.innerHTML = ` <img src="${model.thumbnail}" alt="${model.title}"> <div class="thumbnail-title"> ${model.title} </div> `; thumbnail.addEventListener( "click", function () { loadModel(index); } ); thumbnailGallery.appendChild( thumbnail ); }); /* * ====================================================== * FULLSCREEN * ====================================================== */ function toggleFullscreen() { const container = document.querySelector( ".viewer-container" ); if (!document.fullscreenElement) { container.requestFullscreen(); } else { document.exitFullscreen(); } } /* * ====================================================== * LOAD FIRST MODEL * ====================================================== */ loadModel(0); </script>

</body>

</html>
